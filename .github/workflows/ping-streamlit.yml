jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: curl -sL -o /dev/null -w "%{http_code}" https://supervea-faq-demo-bg3hrfutoi7f6uf4nvysnb.streamlit.app/healthz
name: Ping Streamlit App
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Puppeteer
        run: npm install puppeteer
      - name: Load Streamlit App via Browser
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            console.log('Navigating to app...');
            await page.goto('https://supervea-faq-demo-bg3hrfutoi7f6uf4nvysnb.streamlit.app/', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 5000));
            console.log('Ping complete.');
            await browser.close();
          })();
          "
